[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencelab"
version = "0.1.0"
description = "An evaluation-first, source-grounded document question-answering API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EvidenceLab contributors"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.1,<6.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.3,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
